<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion -- Bibliotheque</title>
  <link rel="stylesheet" href="/static/css/eink.css">
  <style>
    .login-wrap {
      max-width: 480px;
      margin: 60px auto 0;
      padding: 0 16px;
    }
    .login-title {
      font-size: 1.6rem;
      margin-bottom: 32px;
      text-align: center;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .login-form input[type="password"] {
      font-family: inherit;
      font-size: 1.2rem;
      padding: 14px 16px;
      border: 3px solid #000;
      background: #fff;
      color: #000;
      min-height: 56px;
      width: 100%;
      border-radius: 0;
      -webkit-appearance: none;
      appearance: none;
    }
    .login-form button[type="submit"] {
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 16px;
      border: 3px solid #000;
      background: #000;
      color: #fff;
      min-height: 56px;
      width: 100%;
      cursor: pointer;
      border-radius: 0;
      -webkit-appearance: none;
      appearance: none;
    }
    .login-error {
      border: 2px solid #000;
      padding: 14px 16px;
      font-size: 1rem;
      text-align: center;
      background: #f0f0f0;
    }
    .login-version {
      text-align: center;
      font-size: 1.6rem;
      color: #000;
      margin-top: 48px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <h1 class="login-title">Bibliotheque</h1>

    {% if error %}
    <p class="login-error">{{ error }}</p>
    {% endif %}

    <form class="login-form" method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <input
        type="password"
        name="password"
        placeholder="Mot de passe"
        autofocus
        autocomplete="current-password"
      >
      <button type="submit">Connexion</button>
    </form>

    <p class="login-version">v1.4</p>
  </div>
</body>
</html>
