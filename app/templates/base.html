<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="htmx-config" content='{"historyEnabled":false}'>
  <title>{% block title %}Bibliotheque{% endblock %} -- Calibre</title>
  <link rel="stylesheet" href="/static/css/eink.css">
  <script src="/static/js/htmx.min.js"></script>
  <script>
    document.addEventListener('htmx:beforeHistoryUpdate', function(e) {
      e.preventDefault();
    });
    function fermerApp() {
      location.replace('about:blank');
    }
  </script>
</head>
<body hx-boost="true">
  <header class="site-header">
    <div class="header-top">
      <a href="/" class="site-title">Bibliotheque</a>
      <button class="btn-close-browser" onclick="fermerApp()" title="Fermer le navigateur">X Fermer</button>
    </div>
    {% if breadcrumbs %}
    <nav class="breadcrumb" aria-label="Navigation">
      <a href="/">Accueil</a>
      {% for label, url in breadcrumbs %}
        <span aria-hidden="true"> &rsaquo; </span>
        {% if loop.last %}
          <span class="current">{{ label }}</span>
        {% else %}
          <a href="{{ url }}">{{ label }}</a>
        {% endif %}
      {% endfor %}
    </nav>
    {% endif %}
    <form class="search-form" action="/search" method="get">
      <input type="search" name="q" placeholder="Rechercher un livre ou auteur..." value="{{ q | default('') }}" autocomplete="off" autocorrect="off" autocapitalize="off">
      <button type="submit" aria-label="Chercher">Chercher</button>
    </form>
  </header>
  <main class="main-content">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <a href="/">Accueil</a><span>&middot;</span>
    <a href="/books">Livres</a><span>&middot;</span>
    <a href="/authors">Auteurs</a><span>&middot;</span>
    <a href="/tags">Genres</a><span>&middot;</span>
    <a href="/series">Series</a>
  </footer>
</body>
</html>
