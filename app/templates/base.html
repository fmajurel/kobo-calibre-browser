<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="htmx-config" content='{"historyEnabled":false}'>
  <title>{% block title %}Bibliothèque{% endblock %} — Calibre</title>
  <link rel="stylesheet" href="/static/css/eink.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body hx-boost="true">

  <header class="site-header">
    <div class="header-top">
      <a href="/" class="site-title">📚 Bibliothèque</a>
      <a href="javascript:window.close()" class="btn-close-browser" title="Fermer le navigateur">✕</a>
    </div>

    {# Breadcrumb #}
    {% if breadcrumbs %}
    <nav class="breadcrumb" aria-label="Navigation">
      <a href="/">Accueil</a>
      {% for label, url in breadcrumbs %}
        <span aria-hidden="true"> › </span>
        {% if loop.last %}
          <span class="current">{{ label }}</span>
        {% else %}
          <a href="{{ url }}">{{ label }}</a>
        {% endif %}
      {% endfor %}
    </nav>
    {% endif %}

    {# Barre de recherche #}
    <form class="search-form" action="/search" method="get">
      <input
        type="search"
        name="q"
        placeholder="Rechercher un livre ou auteur…"
        value="{{ q | default('') }}"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
      >
      <button type="submit" aria-label="Chercher">🔍</button>
    </form>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <a href="/">Accueil</a>
    <span>·</span>
    <a href="/books">Livres</a>
    <span>·</span>
    <a href="/authors">Auteurs</a>
    <span>·</span>
    <a href="/tags">Genres</a>
    <span>·</span>
    <a href="/series">Séries</a>
  </footer>

</body>
</html>
